name: Release

# Builds Linux / Windows / macOS binaries for every commit pushed to main,
# installs and launches every package it built, and uploads them as run
# artifacts (the Travis "build row" convention, kept 90 days).
#
# Publishing the rolling `latest` GitHub Release is NOT done here: publish.yml
# picks up a successful run of this workflow via `workflow_run`. That split is
# what lets this workflow cancel superseded runs freely -- a cancellation here
# can only ever kill a build, never a half-finished upload. See publish.yml.
#
# Pull requests are handled by ci.yml instead; it tests but packages nothing.
#
# Every third-party action is pinned to a full commit SHA, with the tag it was
# resolved from in a trailing comment. Tags are mutable; SHAs are not.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  # Per ref, so a manual run from a feature branch cannot cancel main's build
  # (or the other way round).
  group: release-${{ github.ref }}
  # Supersede in-flight builds: only the newest commit can become `latest`, so
  # spending runner minutes on an outdated one just delays the answer. Safe now
  # that nothing in this workflow writes to the release.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          set -euo pipefail
          # Must match Cargo.toml's `version` key exactly. A workspace
          # inheritance (`version.workspace = true`) or single quotes would
          # otherwise yield an empty string and produce files named
          # "MaterialCraft__<label>".
          v=$(grep -m1 -E '^version[[:space:]]*=[[:space:]]*"' Cargo.toml | cut -d'"' -f2)
          [ -n "$v" ] || { echo "could not read version from Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Gate: a release must never be published from a commit whose tests fail on
  # ANY platform it ships for. Several numeric paths go through the platform
  # libm, which differs between glibc, MSVC's CRT and Apple's libm, so a
  # Linux-only gate would let a Windows- or macOS-only regression ship.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Linux system libraries for the editor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Tests
        run: cargo test --release

  build:
    name: Build ${{ matrix.label }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Build provenance: binds each published file to this workflow run and
      # commit. Verify with `gh attestation verify <file> -R <owner>/<repo>`.
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # `label` is what appears in the published file name. It mirrors the
          # ArtCraft convention -- ArtCraft_0.41.0_x64-setup.exe -- where the
          # version comes second and the platform is a short human label, not a
          # Rust target triple.
          #
          # Linux builds on the OLDEST supported Ubuntu image on purpose: the
          # binaries link against the build host's glibc, and a 24.04 build
          # (glibc 2.39) refuses to start on Debian 12 (2.36) or Ubuntu 22.04.
          # 22.04 gives glibc 2.35, which every current distro meets.
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            out: target/x86_64-unknown-linux-gnu/release
            label: x86_64-linux
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            out: target/x86_64-pc-windows-msvc/release
            label: x64-windows
          # One universal (arm64 + x86_64) build, as ArtCraft ships
          # ArtCraft_<v>_universal.dmg. Both slices are compiled on the Apple
          # Silicon runner and merged with lipo, which also removes any
          # dependency on macos-15-intel -- the last x86_64 GitHub-hosted image,
          # retired after August 2027. The x86_64 slice is still executed, under
          # Rosetta, by the verify job.
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            out: target/universal-apple-darwin/release
            label: universal-macOS
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ matrix.label }}
      TARGETS: ${{ matrix.targets }}
      OUT: ${{ matrix.out }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Comma-separated target list for the toolchain action
        id: tc
        run: echo "targets=${TARGETS// /,}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ steps.tc.outputs.targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.label }}

      - name: Linux system libraries for the editor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev \
            rpm fakeroot dpkg-dev libxkbcommon-x11-0

      - name: Build (core + editor)
        run: |
          set -euo pipefail
          args=()
          for t in $TARGETS; do args+=(--target "$t"); done
          cargo build --release --features gui --bins "${args[@]}"

      - name: Merge the macOS slices into universal binaries
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          for b in materialcraft materialcraft-gui; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$b" \
              "target/x86_64-apple-darwin/release/$b" \
              -output "$OUT/$b"
            lipo "$OUT/$b" -verify_arch arm64 x86_64
          done

      - name: Smoke test the CLI
        # Runs the built binary directly rather than via `cargo run`, which
        # would re-resolve features and could rebuild a different binary over
        # the one every packaging step reads.
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          "$OUT/materialcraft$ext" example smoke
          "$OUT/materialcraft$ext" render smoke/brick_wall.mcg smoke/out --size 64
          compgen -G 'smoke/out/*.png' >/dev/null

      # ---------------------------------------------------------------- Linux
      # The AppDir is the single source of truth for the Linux file layout: the
      # .deb, the .rpm and the AppImage are all derived from it. The plain
      # tarball ships a flatter layout.

      - name: Build the AppDir (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          A=AppDir
          rm -rf "$A"
          mkdir -p "$A/usr/bin" "$A/usr/share/applications" "$A/usr/share/icons/hicolor/256x256/apps" dist

          install -m 0755 "$OUT/materialcraft"     "$A/usr/bin/materialcraft"
          install -m 0755 "$OUT/materialcraft-gui" "$A/usr/bin/materialcraft-gui"
          install -m 0644 assets/MaterialCraftLogo.png \
            "$A/usr/share/icons/hicolor/256x256/apps/materialcraft.png"

          cat > "$A/materialcraft.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=MaterialCraft
          Comment=Procedural, node-based material authoring
          Exec=materialcraft-gui
          Icon=materialcraft
          Categories=Graphics;2DGraphics;3DGraphics;
          Terminal=false
          EOF

          install -m 0644 "$A/materialcraft.desktop" "$A/usr/share/applications/materialcraft.desktop"
          install -m 0644 assets/MaterialCraftLogo.png "$A/materialcraft.png"

          # Libraries the editor dlopen()s that a minimal desktop may lack.
          # The .deb and .rpm declare them as dependencies; an AppImage has no
          # package manager, so it carries them. They live in lib/, OUTSIDE
          # usr/, because the .deb copies AppDir/usr wholesale. Everything
          # else it loads (libX11, xkbcommon, EGL/GL, Wayland) is present on
          # any system that can show a window at all, and GL in particular
          # must come from the host to match its driver.
          mkdir -p "$A/lib"
          for so in libxkbcommon-x11.so.0 libxcb-xkb.so.1; do
            src=$(ldconfig -p | awk -v n="$so" '$1 == n && /x86-64/ {print $NF; exit}')
            [ -n "$src" ] || { echo "$so not found on the build host"; exit 1; }
            install -m 0644 "$(readlink -f "$src")" "$A/lib/$so"
          done

          # The AppImage runtime launches $APPDIR/AppRun and nothing else.
          # appimagetool does NOT check for it -- it will happily package an
          # AppDir with no AppRun and report Success, producing an AppImage
          # that cannot start. The verify job launches the result to catch it.
          # A script rather than a symlink, to put lib/ on the search path.
          # $APPDIR is only set by the runtime; derive it when AppRun is run
          # from an --appimage-extract'ed tree.
          cat > "$A/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="${APPDIR:-$(dirname "$(readlink -f "$0")")}"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/materialcraft-gui" "$@"
          APPRUN
          chmod 0755 "$A/AppRun"

      - name: Package .AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="MaterialCraft_${VERSION}_${LABEL}"
          # Both pieces are pinned to immutable, versioned releases and their
          # sha256 checked. appimagetool (the maintained successor of the
          # archived AppImageKit) otherwise downloads the runtime itself at
          # build time from a moving `continuous` tag; --runtime-file stops it.
          # The type2 runtime is statically linked, so the AppImage needs no
          # libfuse2 on the user's machine -- only a working fusermount.
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sSfL -o "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum --check --strict <<EOF
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64
          EOF
          chmod +x "$RUNNER_TEMP/appimagetool"

          # APPIMAGE_EXTRACT_AND_RUN lets appimagetool itself run without FUSE.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --no-appstream \
            --runtime-file "$RUNNER_TEMP/runtime-x86_64" \
            AppDir "dist/$name.AppImage"

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="MaterialCraft_${VERSION}_${LABEL}"
          pkg="$RUNNER_TEMP/debmaterialcraft"
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN"
          cp -r AppDir/usr "$pkg/usr"

          # Depends has two halves. The libraries the binaries link directly
          # (libc, libgcc, libm) are derived by dpkg-shlibdeps from the ELF
          # headers. Everything the editor needs for a window -- X11, Wayland,
          # xkbcommon, EGL/GL -- is loaded with dlopen at runtime by winit and
          # glutin, is therefore invisible to ldd and shlibdeps, and has to be
          # listed by hand. The list is what LD_DEBUG=files shows the editor
          # loading under X11 and under Wayland; libvulkan1 (wgpu probes it but
          # falls back without it) and the Mesa driver are only Recommends.
          # The verify job installs this package into a bare
          # Debian container and launches the editor, so a missing entry here
          # fails the build instead of reaching a user.
          mkdir -p "$RUNNER_TEMP/shlib/debian"
          printf 'Source: materialcraft\n\nPackage: materialcraft\nArchitecture: any\n' \
            > "$RUNNER_TEMP/shlib/debian/control"
          linked=$(cd "$RUNNER_TEMP/shlib" && dpkg-shlibdeps -O \
              "$pkg/usr/bin/materialcraft" "$pkg/usr/bin/materialcraft-gui" \
            | sed -n 's/^shlibs:Depends=//p')
          [ -n "$linked" ] || { echo "dpkg-shlibdeps found no dependencies"; exit 1; }
          dlopened="libx11-6, libx11-xcb1, libxcursor1, libxi6, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libegl1, libgl1"
          echo "linked:    $linked"
          echo "dlopened:  $dlopened"

          cat > "$pkg/DEBIAN/control" <<EOF
          Package: materialcraft
          Version: $VERSION
          Section: graphics
          Priority: optional
          Architecture: $(dpkg --print-architecture)
          Maintainer: MaterialCraft <noreply@example.com>
          Depends: $linked, $dlopened
          Recommends: libgl1-mesa-dri, libvulkan1, xdg-desktop-portal
          Description: Procedural, node-based material authoring engine
           MaterialCraft builds PBR materials from a node graph, with a
           headless renderer, a visual editor and an AI control interface.
          EOF

          dpkg-deb --root-owner-group --build "$pkg" "dist/$name.deb"
          dpkg-deb --info "dist/$name.deb"

      - name: Package .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="MaterialCraft_${VERSION}_${LABEL}"
          top="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$top/SPECS" "$top/BUILD"

          # rpmbuild's AutoReq (left on) derives the linked libraries -- glibc,
          # libgcc -- from the ELF files. The Requires below are only the
          # dlopen()ed ones it cannot see; see the .deb step for why. They are
          # named by file (soname) rather than package so the spec works across
          # Fedora, openSUSE and RHEL, whose package names differ.
          cat > "$top/SPECS/materialcraft.spec" <<EOF
          Name:           materialcraft
          Version:        $VERSION
          Release:        1%{?dist}
          Summary:        Procedural, node-based material authoring engine
          License:        MIT OR Apache-2.0
          URL:            https://github.com/${GITHUB_REPOSITORY}
          BuildArch:      x86_64
          Requires:       libX11.so.6()(64bit)
          Requires:       libXcursor.so.1()(64bit)
          Requires:       libXi.so.6()(64bit)
          Requires:       libX11-xcb.so.1()(64bit)
          Requires:       libxkbcommon.so.0()(64bit)
          Requires:       libxkbcommon-x11.so.0()(64bit)
          Requires:       libwayland-client.so.0()(64bit)
          Requires:       libwayland-egl.so.1()(64bit)
          Requires:       libEGL.so.1()(64bit)
          Requires:       libGL.so.1()(64bit)

          %description
          MaterialCraft builds PBR materials from a node graph, with a
          headless renderer, a visual editor and an AI control interface.

          %prep

          %build

          # Without this section BUILDROOT stays empty and every entry under
          # %files fails with "File not found". %{_appdir} is passed in with
          # --define so this does not depend on rpmbuild's working directory.
          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 0755 %{_appdir}/usr/bin/materialcraft     %{buildroot}/usr/bin/materialcraft
          install -m 0755 %{_appdir}/usr/bin/materialcraft-gui %{buildroot}/usr/bin/materialcraft-gui
          install -m 0644 %{_appdir}/usr/share/applications/materialcraft.desktop %{buildroot}/usr/share/applications/materialcraft.desktop
          install -m 0644 %{_appdir}/materialcraft.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/materialcraft.png

          %files
          /usr/bin/materialcraft
          /usr/bin/materialcraft-gui
          /usr/share/applications/materialcraft.desktop
          /usr/share/icons/hicolor/256x256/apps/materialcraft.png
          EOF

          rpmbuild --define "_topdir $top" \
                   --define "_appdir $PWD/AppDir" \
                   -bb "$top/SPECS/materialcraft.spec"
          # Locate the built rpm rather than guessing the arch directory. The
          # %{_arch} macro is expanded by rpm inside a spec file, NOT by the
          # shell, so it cannot be used on this command line.
          rpm=$(find "$top/RPMS" -name "materialcraft-$VERSION-*.rpm" | head -1)
          [ -n "$rpm" ] || { echo "rpmbuild produced no rpm under $top/RPMS"; exit 1; }
          cp "$rpm" "dist/$name.rpm"
          rpm -qpR "dist/$name.rpm"

      - name: Package tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="MaterialCraft_${VERSION}_${LABEL}"
          stage="$RUNNER_TEMP/stage/$name"
          mkdir -p "$stage" dist
          install -m 0755 "$OUT/materialcraft"     "$stage/materialcraft"
          install -m 0755 "$OUT/materialcraft-gui" "$stage/materialcraft-gui"
          cp LICENSE-APACHE LICENSE-MIT NOTICE README.md "$stage/"
          # No library/ here: src/library.rs compiles every preset in with
          # include_str!, and nothing reads library/ from disk at runtime.
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP/stage" "$name"

      # ---------------------------------------------------------------- Windows

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name  = "MaterialCraft_$($env:VERSION)_$($env:LABEL)"
          $stage = "$env:RUNNER_TEMP/stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # -Path/-Destination must be explicit: "a", "b" binds both to -Path.
          Copy-Item -Path "$env:OUT/materialcraft.exe"     -Destination "$stage/materialcraft.exe"
          Copy-Item -Path "$env:OUT/materialcraft-gui.exe" -Destination "$stage/materialcraft-gui.exe"
          Copy-Item LICENSE-APACHE, LICENSE-MIT, NOTICE, README.md $stage
          # Presets are compiled in via include_str!, so no library/ copy.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"

      # ---------------------------------------------------------------- macOS

      - name: Package (macOS .app bundle + .dmg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          name="MaterialCraft_${VERSION}_${LABEL}"
          stage="$RUNNER_TEMP/stage/dmg"
          app="$stage/MaterialCraft.app"

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          install -m 0755 "$OUT/materialcraft-gui" "$app/Contents/MacOS/materialcraft-gui"

          # Finder only shows a bundle icon from an .icns named by
          # CFBundleIconFile; a bare PNG in Resources is ignored.
          set_="$RUNNER_TEMP/MaterialCraft.iconset"
          mkdir -p "$set_"
          for s in 16 32 128 256; do
            sips -z $s $s           assets/MaterialCraftLogo.png --out "$set_/icon_${s}x${s}.png"    >/dev/null
            sips -z $((s*2)) $((s*2)) assets/MaterialCraftLogo.png --out "$set_/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set_" -o "$app/Contents/Resources/MaterialCraft.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MaterialCraft</string>
            <key>CFBundleDisplayName</key><string>MaterialCraft</string>
            <key>CFBundleExecutable</key><string>materialcraft-gui</string>
            <key>CFBundleIconFile</key><string>MaterialCraft</string>
            <key>CFBundleIdentifier</key><string>org.materialcraft.editor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          # The headless CLI travels next to the bundle, uninstalled and ready.
          install -m 0755 "$OUT/materialcraft" "$stage/materialcraft"
          cp LICENSE-APACHE LICENSE-MIT NOTICE README.md "$stage/"

          # Ad-hoc signature (no Developer ID). lipo output and a bundle
          # assembled by hand carry no valid bundle signature, and Gatekeeper
          # reports an unsigned arm64 app as "damaged and can't be opened" --
          # with no way past it for a normal user. Ad-hoc signed, a downloaded
          # copy instead gets the ordinary "unidentified developer" prompt,
          # which right-click > Open (or System Settings > Privacy & Security)
          # clears. Real notarisation needs an Apple Developer ID; see README.
          codesign --force --sign - "$stage/materialcraft"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          ln -s /Applications "$stage/Applications"
          hdiutil create -volname MaterialCraft -srcfolder "$stage" -ov -format UDZO "dist/$name.dmg"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  # ===========================================================================
  # Install and launch every artifact exactly as a user would get it.
  #
  # The build job only proves the binaries in target/ work. Packaging can still
  # break them -- a missing AppRun, a Depends that omits a dlopen()ed library,
  # a bundle macOS refuses to open -- and none of that shows until something
  # actually installs and starts the package. Each Linux package is installed
  # into a bare distro container rather than on the runner, because the runner
  # image already has nearly every library and would hide a missing dependency.
  #
  # "Launch the editor" means: start it on a virtual display, confirm it is
  # still running after a few seconds, and (where the platform allows) that it
  # has opened a window. A crash on startup, a missing shared library or a
  # failed GL context all exit early and fail the step.
  # ===========================================================================
  verify:
    name: Verify ${{ matrix.check }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: deb,      os: ubuntu-latest,  artifact: x86_64-linux,    image: "debian:12" }
          - { check: deb,      os: ubuntu-latest,  artifact: x86_64-linux,    image: "ubuntu:22.04" }
          - { check: rpm,      os: ubuntu-latest,  artifact: x86_64-linux,    image: "fedora:latest" }
          - { check: tarball,  os: ubuntu-latest,  artifact: x86_64-linux,    image: "ubuntu:24.04" }
          - { check: appimage, os: ubuntu-latest,  artifact: x86_64-linux }
          - { check: zip,      os: windows-latest, artifact: x64-windows }
          - { check: dmg,      os: macos-latest,   artifact: universal-macOS }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARTIFACT: ${{ matrix.artifact }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
          # -ac: the containers below connect as root, a different user.
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # ------------------------------------------------ Linux distro packages
      # --ipc host is required, not incidental: Mesa's software rasteriser
      # hands frames to the X server through MIT-SHM, which fails with a
      # Glutin BadValue across IPC namespaces and looks exactly like a broken
      # package.
      - name: Install into ${{ matrix.image }} and run
        if: matrix.image != ''
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          docker run -d --name app --ipc host \
            -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/scripts:ro" \
            -v /tmp/.X11-unix:/tmp/.X11-unix \
            -e VERSION -e ARTIFACT -e CHECK -e DISPLAY -e XDG_RUNTIME_DIR=/tmp \
            "$IMAGE" sleep infinity
          docker exec app bash /scripts/verify-linux-package.sh
          if [ "$CHECK" != tarball ]; then
            bash .github/scripts/launch-gui.sh docker exec app materialcraft-gui
          fi

      - name: Remove the container
        if: always() && matrix.image != ''
        run: docker rm -f app || true

      # ------------------------------------------------ AppImage
      # GitHub's Ubuntu runners are full VMs with /dev/fuse, so the AppImage can
      # be launched the normal way -- mounted through FUSE by its own runtime --
      # which is the path users take. --appimage-extract is also exercised, as
      # the fallback users without FUSE (containers, some locked-down hosts)
      # are told to use.
      - name: Launch the AppImage (FUSE and extracted)
        if: matrix.check == 'appimage'
        run: |
          set -euo pipefail
          sudo apt-get install -y fuse3 libgl1-mesa-dri libegl1
          ai="dist/MaterialCraft_${VERSION}_${ARTIFACT}.AppImage"
          chmod +x "$ai"
          bash .github/scripts/launch-gui.sh "$ai"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$ai" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/AppRun"
          bash .github/scripts/launch-gui.sh "$RUNNER_TEMP/squashfs-root/AppRun"

      # ------------------------------------------------ Windows
      - name: Extract the zip and run
        if: matrix.check == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "MaterialCraft_$($env:VERSION)_$($env:ARTIFACT)"
          Expand-Archive "dist/$name.zip" -DestinationPath "$env:RUNNER_TEMP/x"
          $dir = "$env:RUNNER_TEMP/x/$name"
          & "$dir/materialcraft.exe" example "$env:RUNNER_TEMP/smoke"
          if ($LASTEXITCODE) { throw "example exited $LASTEXITCODE" }
          & "$dir/materialcraft.exe" render "$env:RUNNER_TEMP/smoke/brick_wall.mcg" "$env:RUNNER_TEMP/smoke/out" --size 64
          if ($LASTEXITCODE) { throw "render exited $LASTEXITCODE" }
          if (-not (Get-ChildItem "$env:RUNNER_TEMP/smoke/out" -Filter *.png)) { throw "render wrote no PNG" }

          # Windows Server runners have only the Basic Display Adapter, whose
          # OpenGL 1.1 cannot host the editor's GL 3 context. Mesa's software
          # rasteriser, dropped next to the exe in this TEST copy only, stands
          # in for the GPU driver every real Windows desktop has. It is never
          # shipped.
          $mesa = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z" -OutFile $mesa
          $h = (Get-FileHash $mesa -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw "mesa sha256 mismatch: $h" }
          7z x $mesa "-o$env:RUNNER_TEMP/mesa" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/mesa/x64/*.dll" $dir

          $p = Start-Process -FilePath "$dir/materialcraft-gui.exe" -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { throw "materialcraft-gui exited early with code $($p.ExitCode)" }
          if (-not $p.MainWindowTitle) { throw "materialcraft-gui is running but opened no window" }
          Write-Host "editor running, window: $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

      # ------------------------------------------------ macOS
      - name: Mount the dmg and run both slices
        if: matrix.check == 'dmg'
        run: |
          set -euo pipefail
          dmg="dist/MaterialCraft_${VERSION}_${ARTIFACT}.dmg"
          # No quarantine flag is simulated: an ad-hoc signed build is not
          # notarised, so Gatekeeper would (correctly) refuse it and this job
          # could never pass. What users do about that is in the README.
          mnt="$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -force >/dev/null || true' EXIT
          app="$mnt/MaterialCraft.app"
          test -f "$app/Contents/Resources/MaterialCraft.icns"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/materialcraft-gui" -verify_arch arm64 x86_64
          lipo "$mnt/materialcraft" -verify_arch arm64 x86_64

          cd "$RUNNER_TEMP"
          "$mnt/materialcraft" example smoke
          "$mnt/materialcraft" render smoke/brick_wall.mcg smoke/out --size 64
          compgen -G 'smoke/out/*.png' >/dev/null

          # The x86_64 slice is what Intel Macs run. Execute it under Rosetta,
          # installing Rosetta first if the image lacks it.
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          rm -rf smoke
          arch -x86_64 "$mnt/materialcraft" example smoke
          arch -x86_64 "$mnt/materialcraft" render smoke/brick_wall.mcg smoke/out --size 64
          compgen -G 'smoke/out/*.png' >/dev/null

          # Launch the editor from inside the bundle, both slices.
          for a in arm64 x86_64; do
            arch -$a "$app/Contents/MacOS/materialcraft-gui" &
            pid=$!
            sleep 15
            if ! kill -0 "$pid" 2>/dev/null; then
              rc=0; wait "$pid" || rc=$?
              echo "::error::editor ($a) exited early with status $rc"; exit 1
            fi
            echo "editor ($a) running"
            kill "$pid"; wait "$pid" || true
          done
