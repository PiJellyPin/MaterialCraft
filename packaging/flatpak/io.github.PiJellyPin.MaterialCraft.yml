app-id: io.github.PiJellyPin.MaterialCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: materialcraft-gui
finish-args:
  # Use X11 because winit's Wayland backend does not deliver package file drops.
  - --socket=x11
  # Share memory with the X server for X11 rendering.
  - --share=ipc
  # Give wgpu and the editor access to GPU render devices.
  - --device=dri
  # Packages resolve linked .sbs files and images relative to the package path.
  - --filesystem=home
  # Host MCP clients connect to the editor or CLI serve process over localhost TCP.
  - --share=network

modules:
  - name: materialcraft
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/materialcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --features gui --release --locked --bin materialcraft --bin materialcraft-gui
      - install -Dm0755 target/release/materialcraft /app/bin/materialcraft
      - install -Dm0755 target/release/materialcraft-gui /app/bin/materialcraft-gui
      - install -Dm0644 "packaging/flatpak/$FLATPAK_ID.desktop" "/app/share/applications/$FLATPAK_ID.desktop"
      - install -Dm0644 "packaging/flatpak/$FLATPAK_ID.metainfo.xml" "/app/share/metainfo/$FLATPAK_ID.metainfo.xml"
      # AppStream takes icons in the standard sizes up to 512 pixels; the logo is 1024, so a 256 copy is kept here.
      - install -Dm0644 packaging/flatpak/icon-256.png "/app/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png"
      # Resolve the font notices from the same vendored dependencies as the build.
      - RUNNER_TEMP="$PWD/target" python3 .github/scripts/collect-notices.py
      - install -d /app/share/doc/materialcraft
      - cp -R target/materialcraft-notices/. /app/share/doc/materialcraft/
    sources:
      # The packaging script stages the release checkout next to this manifest.
      - type: dir
        path: ../..
      - cargo-sources.json
